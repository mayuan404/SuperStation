<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Cosmos</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <canvas id="sky"></canvas>

  <header class="hud">
    <div class="brand">
      <span class="mark">✦</span>
      <span class="name">Local Cosmos</span>
    </div>
    <div class="search">
      <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
        <circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <path d="M10.5 10.5 L14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <input id="search" type="text" placeholder="搜索文件名、路径，或 *.js  >10mb" spellcheck="false" autocomplete="off">
      <kbd class="kbd">/</kbd>
    </div>

    <div class="results" id="results" hidden>
      <div class="results-head" id="resultsHead"></div>
      <div class="results-list" id="resultsList"></div>
      <div class="results-foot"><span>↑↓ 选择</span><span>↵ 定位</span><span>⇧↵ 预览</span><span>esc 关闭</span></div>
    </div>
    <div class="galaxies" id="galaxyBar"></div>
    <div class="stats" id="stats"></div>
    <label class="exposure" title="曝光（拖动调整）">
      <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
        <circle cx="8" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.3"/>
        <path d="M8 1.2v1.8M8 13v1.8M1.2 8h1.8M13 8h1.8M3.2 3.2l1.3 1.3M11.5 11.5l1.3 1.3M12.8 3.2l-1.3 1.3M4.5 11.5l-1.3 1.3"
              stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
      </svg>
      <input id="gain" type="range" min="35" max="200" value="100" aria-label="曝光">
    </label>
    <button class="ghost" id="addGalaxy">+ 星系</button>
    <button class="ghost" id="fit">全图</button>
    <button class="ghost" id="rescan">重扫</button>
  </header>

  <aside class="panel" id="panel" hidden>
    <button class="close" id="closePanel" aria-label="关闭">
      <svg viewBox="0 0 16 16" width="12" height="12"><path d="M4 4 L12 12 M12 4 L4 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
    <div class="panel-body" id="panelBody"></div>
  </aside>

  <div class="viewer" id="viewer" hidden>
    <div class="viewer-panel">
      <header class="viewer-head">
        <div class="viewer-title">
          <div class="viewer-name" id="viewerName"></div>
          <div class="viewer-path" id="viewerPath"></div>
        </div>
        <div class="viewer-actions">
          <button class="ghost" id="viewerQuick" title="用系统快速预览查看">快速预览</button>
          <button class="ghost" id="viewerReveal" title="在 Finder 中显示">显示位置</button>
          <button class="ghost" id="viewerOpen" title="用默认应用打开">外部打开</button>
          <button class="icon-btn" id="viewerClose" aria-label="关闭">✕</button>
        </div>
      </header>
      <div class="viewer-body" id="viewerBody"></div>
      <footer class="viewer-foot" id="viewerFoot"></footer>
    </div>
  </div>

  <div class="tooltip" id="tooltip" hidden></div>

  <footer class="hint" id="hint">
    <span>拖拽平移</span><i>·</i><span>滚轮缩放</span><i>·</i><span>点击查看</span><i>·</i><span>双击打开文件</span>
  </footer>

  <div class="legend">
    <span class="legend-label">年轻</span>
    <i class="legend-bar"></i>
    <span class="legend-label">久远</span>
  </div>

  <div class="picker" id="picker" hidden>
    <div class="picker-card">
      <button class="picker-close" id="pickClose" aria-label="关闭">×</button>
      <h2>选择你想仰望的星系</h2>
      <p class="lede">每次只加载你指定的目录，扫过的会缓存下来。<br>一个目录 = 一个星系，其中的文件夹 = 星云。</p>
      <div class="pick-list" id="pickList"></div>
      <div class="pick-custom">
        <input id="pickPath" placeholder="或粘贴任意绝对路径，如 ~/code" spellcheck="false">
        <button class="btn-sm" id="pickGo">巡天</button>
      </div>
      <div class="pick-foot">之后随时可以点顶部「+ 星系」再加。</div>
    </div>
  </div>

  <div class="loading" id="loading" hidden>正在巡天…</div>

  <script src="/app.js"></script>
</body>
</html>
